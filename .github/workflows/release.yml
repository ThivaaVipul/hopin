# Publishes a release on every push to main that ships a change.
#
# Versions follow Conventional Commits since the last release tag:
#   fix / perf / revert -> patch (0.1.1), feat -> minor (0.2.0),
#   "feat!:" or "BREAKING CHANGE:" -> major (1.0.0).
# Other types (docs, chore, ci, test, refactor, style, build) don't release, and
# only commits that change app/ count. The first release uses the version in
# app/pubspec.yaml once there is a change to ship, and a pubspec version above
# the computed one wins.
#
# A release builds the signed arm64 APK, checks that it carries the release
# key's certificate (never the debug key the build falls back to), and publishes
# a GitHub Release with the APK and its checksum. The app looks for newer
# releases there. Run it by hand with "build only" to test the build and the
# signing without publishing anything.
#
# It runs only on pushes to main and by hand, never on pull requests, so the
# signing key never reaches code from a fork.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and check the signed APK without publishing
        type: boolean
        default: true

# One release at a time; never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The release key's certificate (public). Every published APK must carry it.
  RELEASE_CERT_SHA256: c106a25d28bdc8265e8f317ab5029299d222d7160c8fc1135f87c77f9465ef7f

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      build-number: ${{ steps.next.outputs.build_number }}
      build: ${{ steps.gate.outputs.build }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - id: next
        run: python scripts/release/next_release.py

      # Every release must be signed with the same key, so without it nothing is
      # built and a due release is skipped with a warning instead of failing.
      - id: gate
        env:
          DUE: ${{ steps.next.outputs.release }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.FIREBASE_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            if [ "$DUE" = "true" ] || [ "$BUILD_ONLY" = "true" ]; then
              echo "::warning::The signing key or Firebase API key secrets are missing (README, Releases), so nothing was built."
            fi
            build=false; publish=false
          elif [ "$BUILD_ONLY" = "true" ]; then
            build=true; publish=false
          else
            build=$DUE; publish=$DUE
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the tag and the GitHub Release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Java 21: MapLibre's Android module compiles for Java 21
      # (maplibre_gl's sourceCompatibility), so Java 17 cannot build it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      # HOPIN_BUILD tells the app its own number, so it can spot a newer release.
      # The Firebase API key comes from a secret, never the repo.
      - name: Check and build
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          printf '{"HOPIN_FIREBASE_API_KEY": "%s"}\n' "$FIREBASE_API_KEY" > "$RUNNER_TEMP/firebase.json"
          flutter pub get
          flutter analyze
          flutter test
          # 64-bit ARM only: about a third of the universal APK. Not --split-per-abi,
          # which adds 2000 to the version code.
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=HOPIN_BUILD="$BUILD_NUMBER" \
            --dart-define-from-file="$RUNNER_TEMP/firebase.json"

      - name: Check the signature
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee signers.txt
          if ! grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" signers.txt; then
            echo "::error::The APK is not signed with the release key."
            exit 1
          fi

      - name: Release notes
        run: python scripts/release/next_release.py && cat release-notes.md

      - name: Checksums
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/hopin-$VERSION.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Hopin $tag" --notes-file release-notes.md
          fi
