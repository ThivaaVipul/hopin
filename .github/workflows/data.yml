# Builds the route data the app downloads (docs/PLAN.md, Which bus) and
# publishes it on the repo's "data" release.
#
# Weekly, and by hand. scripts/data/build_data.py gathers OpenStreetMap's bus
# routes, NTC's long-distance timetables and LMT's Metro routes for the whole
# island and writes one file per source. The "data" release is a prerelease
# that is never marked latest, so the app's updater (which reads the latest
# release) never takes it for a new version, and its tag isn't a v* tag, so
# release versioning ignores it. A source that fails writes nothing, so last
# week's file stays on the release, and the run fails so it gets noticed.
#
# GitHub pauses a public repo's scheduled workflows after 60 days without
# activity; running this by hand starts it again.
name: Route data

on:
  schedule:
    - cron: '30 1 * * 1' # Mondays, 07:00 in Sri Lanka
  workflow_dispatch:

concurrency:
  group: route-data
  cancel-in-progress: false

permissions:
  contents: write # the data release and its files

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data/requirements.txt

      - name: Build the route data
        id: build
        continue-on-error: true # publish what was built, then fail below
        run: |
          pip install -r scripts/data/requirements.txt
          python scripts/data/build_data.py --out data-out

      - name: Publish on the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(data-out/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing was built, so the release keeps its files."
            exit 0
          fi
          if ! gh release view data > /dev/null 2>&1; then
            gh release create data --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Route data" \
              --notes "Bus routes and timetables for the app, rebuilt every week. Not an app release."
          fi
          gh release upload data "${files[@]}" --clobber

      - name: Fail when a source failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::A source failed; its last good file stays on the release. See the build step."
          exit 1
