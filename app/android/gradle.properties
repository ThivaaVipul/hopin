# Small enough for any of GitHub's standard runners (the smallest has 7 GB of
# memory), where the template's 8 GB can outgrow the machine in a release
# build: Gradle 4 GB, Kotlin 1.5 GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536M
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
